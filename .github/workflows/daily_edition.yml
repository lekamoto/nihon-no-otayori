name: Gerar Edicao Diaria da Revista Japonesa

on:
  schedule:
    # Executa todos os dias às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub se desejar

jobs:
  build-and-commit:
    runs-on: self-hosted
    permissions:
      contents: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
      ACTIONS_NODE20_ALLOW_UNSECURE: true
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar Gerador Diário
        run: |
          python generate_daily.py

      - name: Commitar e Enviar Nova Edição Diária
        shell: powershell
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add edicoes/
          git status
          git status --porcelain | Out-String | ForEach-Object { if ($_ -ne "") { git commit -m "Auto-generate: Edicao Diaria"; git push origin main } }

      - name: Identificar Edição do Dia e Enviar E-mail
        shell: powershell
        run: |
          $today_png = Get-ChildItem -Path "edicoes" -Filter "*.png" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $today_html = Get-ChildItem -Path "edicoes" -Filter "*.html" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          "PNG_PATH=$($today_png.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HTML_PATH=$($today_html.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enviar Carta por E-mail
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: Carta do Japão
          to: lekamoto@gmail.com
          from: Carta do Japao <${{ secrets.MAIL_USERNAME }}>
          html_body: file://${{ env.HTML_PATH }}
          attachments: ${{ env.PNG_PATH }},${{ env.HTML_PATH }}

