name: Gerar Edicao Diaria da Revista Japonesa

on:
  schedule:
    # Executa todos os dias às 21:00 UTC (18:00 no horário de Brasília)
    - cron: '0 21 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão no GitHub se desejar

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Executar Gerador Diário
        run: |
          python generate_daily.py

      - name: Commitar e Enviar Nova Edição Diária
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add edicoes/
          git commit -m "Auto-generate: Edicao Diaria $(date +'%Y-%m-%d')" || exit 0
          git push
